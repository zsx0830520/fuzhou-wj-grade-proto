<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专项监测 · 申请</title>
  <link rel="stylesheet" href="../assets/vendor/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="../assets/app.css?v=33">
</head>
<body>
  <div class="app" id="app"></div>
  <script src="../assets/common.js?v=41"></script>
  <script>
    function opt(list, extra) {
      return (extra || `<option value="">全部</option>`) + list.map((x) => `<option>${x}</option>`).join("");
    }
    function fld(id, label, html) {
      return `<div class="flt-item"><label>${label}</label>${html}</div>`;
    }
    function qv(id) {
      const el = document.getElementById(id);
      return el ? (el.value || "").trim() : "";
    }

    document.getElementById("app").innerHTML = shellStart() + `
      <section class="card">
        <div class="flt-grid">
          ${fld("q-name", "监测任务名称", `<input id="q-name" autocomplete="off">`)}
          ${fld("q-type", "任务类型", `<select id="q-type">${opt(APPLY_TYPES)}</select>`)}
          ${fld("q-deadline", "完成期限", `<input id="q-deadline" type="date">`)}
          ${fld("q-done", "是否完成", `<select id="q-done"><option value="">全部</option><option>是</option><option>否</option></select>`)}
        </div>
        <div class="apply-toolbar">
          <div class="ops">
            <div class="flt-actions">
              <button type="button" class="btn-ghost" onclick="clearQ()">${antIco("clear", "清空")}</button>
              <button type="button" class="btn-primary" onclick="paint()">${antIco("search", "查询")}</button>
            </div>
            <button type="button" class="btn-primary" onclick="openApplyAdd()">新增专项需求</button>
          </div>
          <aside class="clue-tip">该列表只展示本人申请的数据</aside>
        </div>
        <div class="table-wrap"><table>
          <thead><tr>
            <th>序号</th><th>监测任务名称</th><th>任务类型</th><th>完成期限</th>
            <th>申请时间</th><th>是否完成</th><th class="tbl-ops">操作</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
      </section>
    ` + shellEnd();
    document.getElementById("crumb").textContent = "专项监测 / 申请";

    function filtered() {
      const name = qv("q-name");
      const type = qv("q-type");
      const deadline = qv("q-deadline");
      const done = qv("q-done");
      return specialApplies().filter((t) => {
        if (name && !(t.name || "").includes(name)) return false;
        if (type && t.type !== type) return false;
        if (deadline && t.deadline !== deadline) return false;
        if (done && t.done !== done) return false;
        return true;
      });
    }
    function paint() {
      document.getElementById("tbody").innerHTML = filtered().map((t, i) => `<tr>
        <td>${i + 1}</td>
        <td>${t.name}</td>
        <td>${t.type}</td>
        <td>${fmtDotDate(t.deadline)}</td>
        <td>${fmtDotDate(t.applied)}</td>
        <td>${t.done}</td>
        <td class="tbl-ops">
          <a href="javascript:void(0)" onclick="openApplyView('${t.id}')">查看</a>
          ${t.done === "是" ? "" : `<a href="javascript:void(0)" onclick="deleteApply('${t.id}')">删除</a>`}
        </td>
      </tr>`).join("") || `<tr><td colspan="7" class="empty">暂无申请</td></tr>`;
    }
    function clearQ() {
      ["q-name", "q-type", "q-deadline", "q-done"].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
      paint();
    }
    function kvRow(k1, v1, k2, v2) {
      return `<div class="kv">
        <div class="k">${k1}</div><div class="v">${v1}</div>
        <div class="k">${k2}</div><div class="v">${v2}</div>
      </div>`;
    }
    function openApplyView(id) {
      const t = specialApplies().find((x) => x.id === id);
      if (!t) return;
      openModal(`
        <div class="modal adj handle-form">
          <div class="adj-h">
            <h3>申请 / 查看</h3>
            <button type="button" class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="adj-body">
            <div class="kv-form">
              ${kvRow("监测任务名称", t.name, "任务类型", t.type)}
              ${kvRow("完成期限", fmtDotDate(t.deadline), "申请时间", fmtDotDate(t.applied))}
              ${kvRow("是否完成", t.done, "申请部门", t.dept || "—")}
              ${kvRow("子库标签", t.tag || "—", "申请人", t.applicant || "—")}
              <div class="kv span">
                <div class="k">监测需求描述</div>
                <div class="v">${t.desc || "—"}</div>
              </div>
            </div>
          </div>
          <div class="adj-foot">
            <button type="button" class="btn-ghost" onclick="closeModal()">返回</button>
          </div>
        </div>`);
    }
    function openApplyAdd() {
      const typeOpts = `<option value="">请选择</option>` + APPLY_TYPES.map((x) => `<option>${x}</option>`).join("");
      openModal(`
        <div class="modal adj handle-form">
          <div class="adj-h">
            <h3>新增专项需求</h3>
            <button type="button" class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="adj-body">
            <div class="kv-form">
              <div class="kv">
                <div class="k"><span class="req">*</span>监测任务名称</div>
                <div class="v"><input id="n-name" autocomplete="off" placeholder="请输入"></div>
                <div class="k"><span class="req">*</span>任务类型</div>
                <div class="v"><select id="n-type">${typeOpts}</select></div>
              </div>
              <div class="kv">
                <div class="k"><span class="req">*</span>完成期限</div>
                <div class="v"><input id="n-deadline" type="date"></div>
                <div class="k"><span class="req">*</span>子库标签</div>
                <div class="v"><input id="n-tag" autocomplete="off" placeholder="请输入"></div>
              </div>
              <div class="kv span">
                <div class="k"><span class="req">*</span>监测需求描述</div>
                <div class="v"><input id="n-desc" autocomplete="off" placeholder="请输入"></div>
              </div>
            </div>
          </div>
          <div class="adj-foot">
            <button type="button" class="btn-ghost" onclick="closeModal()">关闭</button>
            <button type="button" class="btn-primary" onclick="confirmApplyAdd()">提交</button>
          </div>
        </div>`);
    }
    function confirmApplyAdd() {
      if (!qv("n-name") || !qv("n-type") || !qv("n-deadline") || !qv("n-tag") || !qv("n-desc")) {
        return toast("请填写必填项");
      }
      if (!confirm("确认提交专项需求？")) return;
      const id = "SA" + Date.now();
      patchRow("specialApplies", id, {
        id,
        name: qv("n-name"),
        type: qv("n-type"),
        deadline: qv("n-deadline"),
        applied: "2026-09-10",
        done: "否",
        desc: qv("n-desc"),
        tag: qv("n-tag"),
        org: "福建省市场监督管理局",
        applicant: "吴大",
        dept: "食品处",
        canImport: true,
      });
      closeModal();
      toast("已提交");
      paint();
    }
    function deleteApply(id) {
      const t = specialApplies().find((x) => x.id === id);
      if (!t) return;
      if (t.done === "是") return toast("已完成任务不能删除");
      if (!confirm("确认删除该专项需求？")) return;
      patchRow("specialApplies", id, { hidden: true });
      toast("已删除");
      paint();
    }
    window.paint = paint;
    window.clearQ = clearQ;
    window.openApplyAdd = openApplyAdd;
    window.openApplyView = openApplyView;
    window.confirmApplyAdd = confirmApplyAdd;
    window.deleteApply = deleteApply;
    paint();
  </script>
</body>
</html>
