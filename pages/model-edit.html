<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型编辑 · 网监分级分类</title>
  <link rel="stylesheet" href="../assets/vendor/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="../assets/app.css?v=34">
</head>
<body>
  <div class="app" id="app"></div>
  <script src="../assets/common.js?v=41"></script>
  <script>
    const id = qs("id");
    const reuseId = qs("reuse");
    const mode = qs("mode") || (id ? "edit" : "new");
    const src = reuseId ? modelOf(reuseId) : (id ? modelOf(id) : null);
    const type = (src && src.type) || qs("type") || "platform";
    const isReuse = !!reuseId;
    const isView = mode === "view";
    const isEdit = mode === "edit" && !!id;
    if (isEdit && src && modelInUse(src)) {
      toast("模型使用中，不可更改");
      location.replace(page("model-edit.html") + "?id=" + id + "&mode=view");
    }
    const locked = isView || (isEdit && src && modelInUse(src));
    const d = locked ? "disabled" : "";
    const cfg = (src && src.cfg) || {};
    const period = (src && src.period) || "每年一次";
    const titles = { platform: "电商平台", seller: "平台内经营者", live: "直播间运营者" };
    const pageTitle = isReuse ? "新增模型（复用）" : isView ? "查看模型" : isEdit ? "修改模型" : "新增";
    const grades = cfg.grades || (type === "live"
      ? { a: 30, b0: 30, b1: 50, c0: 50, c1: 80, d: 80 }
      : { a: 90, b0: 75, b1: 90, c0: 60, c1: 75, d: 60 });

    function lv(name, val) {
      return `<select class="lv" name="${name}" ${d}>${["A","B","C","D"].map(x =>
        `<option ${x===(val||"A")?"selected":""}>${x}</option>`).join("")}</select>`;
    }
    function num(name, val) {
      return `<input class="blank-num" type="number" name="${name}" value="${val}" ${d}>`;
    }
    function pct(val) {
      return `<input class="pct-in" type="number" min="0" max="100" value="${val}" ${d}> %`;
    }
    function fillBlanks(text, scores) {
      const arr = [].concat(scores == null ? [] : scores);
      let i = 0;
      return text.replace(/__/g, () => num("sc", arr[i++] ?? ""));
    }
    function l3Html(l3) {
      const body = l3.rules
        ? l3.rules.map((r) => `<div>${fillBlanks(r.t, r.s)}</div>`).join("")
        : fillBlanks(l3.text || "达到规定条件，得__分", l3.score);
      return (l3.name ? `<div><b>${l3.name}</b></div>` : "") + body;
    }

    const SELLER_TREE = [
      {
        name: "企业基本状况", w: 50,
        l2: [{
          name: "资质类", w: 100,
          l3: [
            { w: 50, rules: [
              { t: "营业执照正常，得__则", s: 100 },
              { t: "营业执照过期，得__则", s: 60 },
              { t: "营业执照注销、错误，得__则", s: 0 },
            ]},
            { w: 50, rules: [
              { t: "许可证正常，得__则", s: 100 },
              { t: "许可证过期，得__则", s: 60 },
              { t: "许可证注销，得__则", s: 0 },
              { t: "无许可证，得__则", s: 80 },
            ]},
          ],
        }],
      },
      {
        name: "企业监管信息", w: 25,
        l2: [
          { name: "行政处罚", w: 25, l3: [{ w: 100, rules: [
            { t: "3年内行政处罚=0次，得__则", s: 100 },
            { t: "1次≤3年内行政处罚≤2次，得__则", s: 60 },
            { t: "3年内行政处罚≥2次，得__则", s: 0 },
          ]}]},
          { name: "经营异常", w: 25, l3: [{ w: 100, rules: [
            { t: "当前未被列异，得__则", s: 100 },
            { t: "当前已被列异，得__则", s: 0 },
            { t: "3年内列异次数≥2次，得__则", s: 0 },
          ]}]},
          { name: "投诉举报", w: 25, l3: [{ w: 100, rules: [
            { t: "一年内12315平台投诉=0，得__则", s: 100 },
            { t: "1次≤一年内12315平台投诉≤10次，得__则", s: 60 },
            { t: "一年内12315平台投诉≥10次，得__则", s: 0 },
          ]}]},
          { name: "网络监测", w: 25, l3: [{ w: 100, rules: [
            { t: "一年内网络交易监测发现涉嫌违法违规线索=0，得__则", s: 100 },
            { t: "1次≤一年内网络交易监测发现涉嫌违法违规线索≤5次，得__则", s: 60 },
            { t: "一年内网络交易监测发现涉嫌违法违规线索≥5次，得__则", s: 0 },
          ]}]},
        ],
      },
      {
        name: "企业运营状况", w: 25,
        l2: [
          { name: "网络交易平台", w: 50, l3: [{ w: 100, rules: [
            { t: "本地电商平台，得__则", s: 80 },
            { t: "外地电商平台，得__则", s: 60 },
          ]}]},
          { name: "网店经营规模", w: 25, l3: [{ w: 100, rules: [
            { t: "0≤当年度电商销售额＜10万，得__则", s: 40 },
            { t: "10万≤当年度电商销售额＜100万，得__则", s: 60 },
            { t: "100万≤当年度电商销售额＜1000万，得__则", s: 80 },
            { t: "当年度电商销售额≥1000万，得__则", s: 100 },
            { t: "无销售数据，得__则", s: 50 },
          ]}]},
          { name: "经营产品类型", w: 25, l3: [{ w: 100, rules: [
            { t: "经营包含：食品、药品、医疗器械、化妆品等风险产品，得__则", s: 40 },
            { t: "经营包含：本地企业生产产品，得__则", s: 60 },
          ]}]},
        ],
      },
    ];

    const LIVE_TREE = [
      {
        name: "直播间基本状况", w: 20,
        l2: [{
          name: "资质类", w: 100,
          l3: [
            { name: "营业执照", w: 50, rules: [
              { t: "营业执照正常，得__分", s: 0 },
              { t: "营业执照注销，得__分", s: 80 },
              { t: "营业执照过期，得__分", s: 60 },
              { t: "未匹配到主体库，得__分", s: 100 },
            ]},
            { name: "许可证", w: 50, rules: [
              { t: "许可证正常，得__分", s: 10 },
              { t: "许可证过期，得__分", s: 50 },
              { t: "许可证注销，得__分", s: 80 },
              { t: "无许可证，得__分", s: 20 },
              { t: "未匹配到主体库，得__分", s: 100 },
            ]},
          ],
        }],
      },
      {
        name: "直播间监管信息", w: 40,
        l2: [
          { name: "行政处罚", w: 30, l3: [{ name: "行政处罚情况", w: 100, rules: [
            { t: "3年内行政处罚次数=0，得__分", s: 0 },
            { t: "1≤3年内行政处罚次数≤2，得__分", s: 80 },
            { t: "2＜3年内行政处罚次数，得__分", s: 100 },
            { t: "未匹配到主体库，得__分", s: 60 },
          ]}]},
          { name: "经营异常", w: 30, l3: [{ name: "经营异常情况", w: 100, rules: [
            { t: "当前未被列异且3年内未被列异，得__分", s: 0 },
            { t: "当前未被列异且3年内列异次数≥1次，得__分", s: 30 },
            { t: "当前已被列异且3年内列异次数＜2次，得__分", s: 70 },
            { t: "当前已被列异且3年内列异次数≥2次，得__分", s: 100 },
            { t: "未匹配到主体库，得__分", s: 60 },
          ]}]},
          { name: "投诉举报", w: 20, l3: [{ name: "投诉举报情况", w: 100, rules: [
            { t: "一年内12315平台投诉=0，得__分", s: 0 },
            { t: "1次≤一年内12315平台投诉≤10次，得__分", s: 60 },
            { t: "10＜一年内12315平台投诉，得__分", s: 100 },
            { t: "未匹配到主体库，得__分", s: 60 },
          ]}]},
          { name: "网络监测", w: 20, l3: [{ name: "网络监测情况", w: 100, rules: [
            { t: "一年内网络交易监测发现涉嫌违法违规线索=0，得__分", s: 0 },
            { t: "1≤一年内网络交易监测发现涉嫌违法违规线索≤5，得__分", s: 50 },
            { t: "5＜一年内网络交易监测发现涉嫌违法违规线索，得__分", s: 100 },
          ]}]},
        ],
      },
      {
        name: "直播间运营状况", w: 40,
        l2: [
          { name: "主体属性", w: 20, l3: [
            { name: "近30天开播频率", w: 80, rules: [
              { t: "近30天开播=0，得__分", s: 0 },
              { t: "1次≤近30天开播≤10次，得__分", s: 50 },
              { t: "10＜近30天开播，得__分", s: 80 },
            ]},
            { name: "是否签约MCN机构", w: 20, rules: [
              { t: "是，得__分", s: 30 },
              { t: "否，得__分", s: 80 },
            ]},
          ]},
          { name: "直播间规模", w: 40, l3: [
            { name: "直播间粉丝数", w: 50, rules: [
              { t: "1千以下，得__分", s: 10 },
              { t: "1千至1万，得__分", s: 30 },
              { t: "1万至10万，得__分", s: 50 },
              { t: "10万至100万，得__分", s: 80 },
              { t: "100万至1000万，得__分", s: 50 },
              { t: "1000万以上，得__分", s: 30 },
            ]},
            { name: "关联网店销售额", w: 50, rules: [
              { t: "0≤当年度电商销售额≤10万，得__分", s: 10 },
              { t: "10万＜当年度电商销售额≤100万，得__分", s: 50 },
              { t: "100万＜当年度电商销售额≤1000万，得__分", s: 60 },
              { t: "当年度电商销售额＞1000万，得__分", s: 50 },
              { t: "无销售数据，得__分", s: 30 },
            ]},
          ]},
          { name: "经营产品类型", w: 40, l3: [
            { name: "是否经营风险产品（食品、药品、医疗器械、化妆品）", w: 50, rules: [
              { t: "是，得__分", s: 100 },
              { t: "否，得__分", s: 20 },
            ]},
            { name: "是否本地企业生产产品", w: 50, rules: [
              { t: "是，得__分", s: 100 },
              { t: "否，得__分", s: 20 },
            ]},
          ]},
        ],
      },
    ];

    const SELLER_SPEC = `得分 0—100。一级权重合计 100%；同一一级下二级合计 100%；同一二级下三级合计 100%。同时满足的得分相加，超过 100 按 100 计。<br>
<b>资质类：</b>对接注册系统。食品、药品、医疗器械生产经营许可多本证并存时，取最高得分。<br>
<b>行政处罚：</b>判断字段为平台内经营者主体的「行政处罚数量」。<br>
<b>经营异常：</b>对接列严列异系统。<br>
<b>投诉举报：</b>对接一体化平台 12315。<br>
<b>网络监测：</b>根据系统「监测线索」模块判断。<br>
<b>网店经营规模：</b>判断字段为「网店总销售额」。<br>
<b>经营产品类型：</b>判断「经营产品类别」「是否为本地产品」。`;

    const LIVE_SPEC = `得分 0—100，分值越高风险越高。一级权重合计 100%；同一一级下二级合计 100%；同一二级下三级合计 100%。<br>
<b>资质类：</b>对接主体库 / 注册系统。食品、药品、医疗器械、化妆品等许可多本并存时，取最高得分。未匹配到主体库按表内对应分计。<br>
<b>行政处罚：</b>判断字段为直播间运营者主体的「行政处罚数量」。<br>
<b>经营异常：</b>对接列严列异系统。<br>
<b>投诉举报：</b>对接一体化平台 12315。<br>
<b>网络监测：</b>根据系统「监测线索」模块判断。<br>
<b>近30天开播频率 / 粉丝数 / 关联网店销售额：</b>取直播采集与关联网店数据。<br>
<b>经营产品类型：</b>判断「经营产品类别」「是否为本地产品」。`;

    function renderInfo(withGrades) {
      return `
      <h2 class="sec-h">模型信息</h2>
      <div class="kv-form">
        <div class="kv">
          <div class="k"><span class="req">*</span>模型名称</div>
          <div class="v"><input id="name" value="${isReuse ? "" : (src && src.name) || ""}" ${d} placeholder="${isReuse ? ((src && src.name) || "") + "（复用）" : ""}"></div>
          <div class="k"><span class="req">*</span>评定周期</div>
          <div class="v">
            <div class="radio-row">
              <label><input type="radio" name="period" value="每年一次" ${period==="每年一次"?"checked":""} ${d}> 每年一次</label>
              <label><input type="radio" name="period" value="每季度一次" ${period==="每季度一次"?"checked":""} ${d}> 每季度一次</label>
            </div>
          </div>
        </div>
        ${withGrades ? `
        <div class="kv span">
          <div class="k"><span class="req">*</span>分级分值配置</div>
          <div class="v">
            <div class="grade-cfg">
              ${type === "live" ? `
              <span>A级：得分 ＜ ${num("ga", grades.a)}</span>
              <span>B级：${num("gb0", grades.b0)} ≤得分＜ ${num("gb1", grades.b1)}</span>
              <span>C级：${num("gc0", grades.c0)} ≤得分＜ ${num("gc1", grades.c1)}</span>
              <span>D级：得分 ≥ ${num("gd", grades.d)}</span>
              ` : `
              <span>A级：得分 ≥ ${num("ga", grades.a)}</span>
              <span>B级：${num("gb0", grades.b0)} ≤得分＜ ${num("gb1", grades.b1)}</span>
              <span>C级：${num("gc0", grades.c0)} ≤得分＜ ${num("gc1", grades.c1)}</span>
              <span>D级：得分 ＜ ${num("gd", grades.d)}</span>
              `}
            </div>
          </div>
        </div>` : ""}
        <div class="kv span">
          <div class="k">备注</div>
          <div class="v"><input id="remark" value="${isReuse ? "" : (src && src.remark) || ""}" ${d}></div>
        </div>
      </div>`;
    }

    function renderWeightTree(tree, spec) {
      const rows = [];
      tree.forEach((l1) => {
        const l1span = l1.l2.reduce((n, l2) => n + l2.l3.length, 0);
        let l1done = false;
        l1.l2.forEach((l2) => {
          const l2span = l2.l3.length;
          let l2done = false;
          l2.l3.forEach((l3) => {
            rows.push(`<tr>
              ${l1done ? "" : `<td class="ind-name" rowspan="${l1span}">${l1.name}</td><td class="w-cell" rowspan="${l1span}">${pct(l1.w)}</td>`}
              ${l2done ? "" : `<td rowspan="${l2span}">${l2.name}</td><td class="w-cell" rowspan="${l2span}">${pct(l2.w)}</td>`}
              <td class="l3-cell">${l3Html(l3)}</td>
              <td class="w-cell">${pct(l3.w)}</td>
            </tr>`);
            l1done = true;
            l2done = true;
          });
        });
      });
      return `
        <h2 class="sec-h block-gap">指标配置</h2>
        <p class="spec" style="margin-bottom:10px">${spec}</p>
        <div class="table-wrap">
        <table class="ind-table wt-table">
          <thead><tr>
            <th>一级指标</th><th>一级指标权重</th>
            <th>二级指标</th><th>二级指标权重</th>
            <th>三级指标</th><th>三级指标权重</th>
          </tr></thead>
          <tbody>${rows.join("")}</tbody>
        </table>
        </div>`;
    }

    function riskTable(title, prefix, rows) {
      const r0 = rows[0] || [0, 10, "A"];
      const r1 = rows[1] || [10, 50, "B"];
      const r2 = rows[2] || [50, "C"];
      return `<table class="ind-table">
        <thead><tr><th>三级指标</th><th>判断内容</th><th><span class="req">*</span>判断结果</th></tr></thead>
        <tbody><tr>
          <td class="ind-name">${title}</td>
          <td class="ind-judge">上月投诉举报量</td>
          <td>
            <div class="branch">${num(prefix+"a0", r0[0])} ≤上月投诉举报量＜ ${num(prefix+"a1", r0[1])}，则为 ${lv(prefix+"al", r0[2])} 类</div>
            <div class="branch">${num(prefix+"b0", r1[0])} ≤上月投诉举报量＜ ${num(prefix+"b1", r1[1])}，则为 ${lv(prefix+"bl", r1[2])} 类</div>
            <div class="branch">${num(prefix+"c0", r2[0])} ≥上月投诉举报量，则为 ${lv(prefix+"cl", r2[1] || r2[2])} 类</div>
          </td>
        </tr></tbody>
      </table>`;
    }

    const platformInd = `
      <h2 class="sec-h block-gap">指标配置</h2>
      <p class="spec" style="margin-bottom:10px">
        <b>一级「是否商品交易平台」：</b>判断字段为电商平台主体中的「标签」，需对接政务数据。<br>
        <b>二级重点产品：</b>判断字段为「平台内产品属性」。可用；号分隔多个，默认食品、药品、医疗器械、化妆品。<br>
        <b>三级区间：</b>下划线仅填数字，类别为 ABCD 下拉。
      </p>
      <table class="ind-table">
        <thead><tr><th>一级指标</th><th>判断内容</th><th><span class="req">*</span>判断结果</th></tr></thead>
        <tbody><tr>
          <td class="ind-name">平台性质</td>
          <td class="ind-judge">是否商品交易平台</td>
          <td>
            <div class="branch">是：则为 ${lv("l1Yes", cfg.l1Yes || "A")} 类</div>
            <div class="branch">否：则判断二级指标（平台内产品属性）</div>
          </td>
        </tr></tbody>
      </table>
      <table class="ind-table">
        <thead><tr><th>二级指标</th><th>判断内容</th><th><span class="req">*</span>判断结果</th></tr></thead>
        <tbody><tr>
          <td class="ind-name">平台内产品属性</td>
          <td class="ind-judge">是否经营重点产品：<input class="prod-edit" name="products" value="${cfg.products || "食品；药品；医疗器械；化妆品"}" ${d}></td>
          <td>
            <div class="branch">是：则判断三级指标（经营风险1）</div>
            <div class="branch">否：则判断三级指标（经营风险2）</div>
          </td>
        </tr></tbody>
      </table>
      <div class="l3-grid">
        ${riskTable("经营风险1", "r1", cfg.r1 || [[0,10,"A"],[10,50,"B"],[50,"C"]])}
        ${riskTable("经营风险2", "r2", cfg.r2 || [[0,5,"B"],[5,20,"C"],[20,"D"]])}
      </div>`;

    let bodyInd = platformInd;
    if (type === "seller") bodyInd = renderWeightTree(SELLER_TREE, SELLER_SPEC);
    if (type === "live") bodyInd = renderWeightTree(LIVE_TREE, LIVE_SPEC);

    document.getElementById("app").innerHTML = shellStart() + `
      <section class="card">
        ${renderInfo(type !== "platform")}
        ${bodyInd}
        <div class="form-foot">
          <a class="btn-ghost" href="${page("model.html")}?type=${type}">取消</a>
          ${locked ? "" : `<button type="button" class="btn-primary" id="btn-save">保存</button>`}
        </div>
      </section>
    ` + shellEnd();
    const crumb = document.getElementById("crumb");
    if (crumb) crumb.textContent = titles[type] + " / " + pageTitle;
    const pageEl = document.querySelector(".page");
    if (pageEl) pageEl.classList.add("wide");

    function save() {
      const name = (document.getElementById("name").value || "").trim() || (isReuse ? ((src && src.name) || "模型") + "（复用）" : "");
      if (!name) return toast("请填写模型名称");
      toast(isReuse ? "已按复用配置新增模型" : "已保存");
      location.href = page("model.html") + "?type=" + type;
    }
    window.save = save;
    const btnSave = document.getElementById("btn-save");
    if (btnSave) btnSave.addEventListener("click", save);
  </script>
</body>
</html>
