<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>检查列表 · 网监分级分类</title>
  <link rel="stylesheet" href="../assets/vendor/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="../assets/app.css?v=34">
</head>
<body>
  <div class="app" id="app"></div>
  <script src="../assets/common.js?v=41"></script>
  <script>
    const view = qs("view") === "done" ? "done" : "todo";
    const isDone = view === "done";
    const title = isDone ? "已检查" : "待检查";
    const statusSet = isDone ? ["已检查", "无法检查"] : ["未检查", "未指派", "未派发"];
    const statusOpts = isDone ? ["已检查", "无法检查"] : ["未检查", "未指派"];
    const TYPES = ["分级分类定向检查", "专项定向检查"];

    function showSt(k) {
      return k.status === "未派发" ? "未指派" : k.status;
    }
    function v(id) {
      const el = document.getElementById(id);
      return el ? (el.value || "").trim() : "";
    }
    function fld(id, label, html) {
      return `<div class="flt-item"><label>${label}</label>${html}</div>`;
    }
    function stationOpts(empty) {
      return `<option value="">${empty || "全部"}</option>` + Object.keys(STATION_REGION).map((x) => `<option>${x}</option>`).join("");
    }
    function packOfRow(k) {
      return packOf(k.packId) || {};
    }
    function canChangeStation(k) {
      const p = packOfRow(k);
      const st = showSt(k);
      return p.mine !== false && p.status !== "已完成" && (st === "未检查" || st === "未指派");
    }
    function canDelete(k) {
      const p = packOfRow(k);
      return p.mine !== false && showSt(k) === "未指派";
    }

    document.getElementById("app").innerHTML = shellStart() + `
      <section class="card">
        <h2>${title}</h2>
        <div class="flt-grid">
          ${fld("q-type", "任务类型", `<select id="q-type"><option value="">全部</option>${TYPES.map((x) => `<option>${x}</option>`).join("")}</select>`)}
          ${fld("q-shop", "网店名称", `<input id="q-shop" autocomplete="off">`)}
          ${fld("q-url", "网店地址", `<input id="q-url" autocomplete="off">`)}
          ${fld("q-name", "主体名称", `<input id="q-name" autocomplete="off">`)}
          ${fld("q-task", "任务名称", `<select id="q-task"><option value="">全部</option>${[...new Set(packs().map((p) => p.name))].map((x) => `<option>${x}</option>`).join("")}</select>`)}
          ${fld("q-addr", "登记地址", `<input id="q-addr" autocomplete="off">`)}
          ${fld("q-station", "管辖所", `<select id="q-station">${stationOpts("全部")}</select>`)}
          ${fld("q-st", "状态", `<select id="q-st"><option value="">全部</option>${statusOpts.map((x) => `<option>${x}</option>`).join("")}</select>`)}
          ${fld("q-credit", "统一社会信用代码", `<input id="q-credit" autocomplete="off">`)}
          ${fld("q-plat", "所属平台", `<input id="q-plat" autocomplete="off">`)}
          ${fld("q-grade", "分级分类等级", `<select id="q-grade"><option value="">全部</option><option>A</option><option>B</option><option>C</option><option>D</option></select>`)}
        </div>
        <div class="flt-actions">
          <button type="button" class="btn-ghost" onclick="clearQ()">${antIco("clear", "清空")}</button>
          <button type="button" class="btn-primary" onclick="paint()">${antIco("search", "查询")}</button>
        </div>
        <div class="table-wrap"><table class="wide-tbl insp-check-tbl">
          <thead><tr>
            <th>序号</th><th>任务名称</th><th>所属平台</th><th>网店名称</th><th>网店地址</th>
            <th>主体名称</th><th>统一社会信用代码</th><th>登记地址</th><th>管辖所</th>
            <th>分级分类等级</th><th>状态</th><th>操作</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
      </section>
    ` + shellEnd();
    document.getElementById("crumb").textContent = "检查任务管理 / 检查任务 / " + title;
    const pageEl = document.querySelector(".page");
    if (pageEl) pageEl.classList.add("wide");

    function filtered() {
      return checks().filter((k) => statusSet.includes(k.status)).filter((k) => {
        const p = packOfRow(k);
        const st = showSt(k);
        if (v("q-type") && p.type !== v("q-type")) return false;
        if (v("q-shop") && !(k.shopName || k.target || "").includes(v("q-shop"))) return false;
        if (v("q-url") && !(k.url || "").includes(v("q-url"))) return false;
        if (v("q-name") && !(k.name || "").includes(v("q-name"))) return false;
        if (v("q-task") && (p.name || "") !== v("q-task")) return false;
        if (v("q-addr") && !(k.address || "").includes(v("q-addr"))) return false;
        if (v("q-station") && k.station !== v("q-station")) return false;
        if (v("q-st") && st !== v("q-st")) return false;
        if (v("q-credit") && !(k.credit || "").includes(v("q-credit"))) return false;
        if (v("q-plat") && !(k.platName || "").includes(v("q-plat"))) return false;
        if (v("q-grade") && k.grade !== v("q-grade")) return false;
        return true;
      });
    }
    function paint() {
      const rows = filtered();
      document.getElementById("tbody").innerHTML = rows.map((k, i) => {
        const p = packOfRow(k);
        const st = showSt(k);
        const ops = [`<a href="${page("inspect-task.html")}?id=${k.id}&from=${view}">查看</a>`];
        if (canChangeStation(k)) ops.push(`<a href="javascript:void(0)" onclick="openStation('${k.id}')">修改监管所</a>`);
        if (canDelete(k)) ops.push(`<a href="javascript:void(0)" onclick="delOne('${k.id}')">删除</a>`);
        return `<tr>
          <td>${i + 1}</td>
          <td>${p.name || "—"}</td>
          <td>${k.platName || "—"}</td>
          <td>${k.shopName || k.target || "—"}</td>
          <td class="wrap">${k.url || "—"}</td>
          <td>${k.name || "—"}</td>
          <td>${k.credit || "—"}</td>
          <td class="wrap">${k.address || "—"}</td>
          <td>${k.station || "—"}</td>
          <td>${k.grade || "—"}</td>
          <td>${statusChip(st)}</td>
          <td class="tbl-ops">${ops.join(" ")}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="12" class="empty">暂无${title}记录</td></tr>`;
    }
    function clearQ() {
      document.querySelectorAll(".flt-grid input, .flt-grid select").forEach((el) => { el.value = ""; });
      paint();
    }
    function openStation(id) {
      const k = checkOf(id);
      if (!k || !canChangeStation(k)) return toast("当前状态不可修改管辖所");
      const sel = stationOpts("请选择").replace(`>${k.station}<`, ` selected>${k.station}<`);
      openModal(`
        <div class="modal">
          <div class="adj-h" style="padding:0 0 12px;border:0">
            <h3>修改管辖所</h3>
            <button type="button" class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <p class="sub">指定后由该管辖所负责本次检查。未指派的主体将变为未检查。</p>
          <div class="field">
            <label>管辖所</label>
            <select id="d-org">${sel}</select>
          </div>
          <div class="actions" style="margin-top:16px;justify-content:flex-end">
            <button type="button" class="btn-ghost" onclick="closeModal()">取消</button>
            <button type="button" class="btn-primary" onclick="saveStation('${id}')">确定</button>
          </div>
        </div>`);
    }
    function saveStation(id) {
      const org = v("d-org");
      if (!org) return toast("请选择管辖所");
      const k = checkOf(id);
      if (!k) return;
      const s = loadState();
      s.checks = s.checks || {};
      const nextStatus = (showSt(k) === "未指派") ? "未检查" : k.status;
      s.checks[id] = { ...k, station: org, status: nextStatus };
      saveState({ checks: s.checks });
      closeModal();
      toast("已指定由「" + org + "」检查");
      paint();
    }
    function delOne(id) {
      const k = checkOf(id);
      if (!k || !canDelete(k)) return toast("仅未指派记录可删除");
      if (!confirm("确认删除该检查对象？")) return;
      const s = loadState();
      s.checks = s.checks || {};
      s.checks[id] = { ...k, status: "已删除" };
      saveState({ checks: s.checks });
      toast("已删除");
      paint();
    }
    window.paint = paint;
    window.clearQ = clearQ;
    window.openStation = openStation;
    window.saveStation = saveStation;
    window.delOne = delOne;
    paint();
  </script>
</body>
</html>
